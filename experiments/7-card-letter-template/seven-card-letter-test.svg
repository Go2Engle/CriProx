    <rect x="6.55" y="0" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="94.65" y="0" width="88" height="63" rx="2.5" ry="2.5" />

    <rect x="0" y="63.1" width="63" height="88" rx="2.5" ry="2.5" />
    <rect x="63.1" y="63.1" width="63" height="88" rx="2.5" ry="2.5" />
    <rect x="126.2" y="63.1" width="63" height="88" rx="2.5" ry="2.5" />

    <rect x="6.55" y="151.2" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="94.65" y="151.2" width="88" height="63" rx="2.5" ry="2.5" />
  </g>
