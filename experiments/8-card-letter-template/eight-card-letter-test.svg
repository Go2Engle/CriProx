<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="177mm"
  height="255mm"
  viewBox="0 0 177 255"
>
  <title>CriProx experimental eight-card US Letter template</title>
  <desc>
    Eight 63 by 88 millimeter cards rotated ninety degrees, with 2.5 millimeter
    corner radii and 1 millimeter transparent gaps.
  </desc>
  <g fill="#e600c8">
    <rect x="0" y="0" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="89" y="0" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="0" y="64" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="89" y="64" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="0" y="128" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="89" y="128" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="0" y="192" width="88" height="63" rx="2.5" ry="2.5" />
    <rect x="89" y="192" width="88" height="63" rx="2.5" ry="2.5" />
  </g>
</svg>
