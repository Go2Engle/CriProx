name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to rebuild
        required: true
        type: string
      release_ref:
        description: Git ref to build (defaults to the release target)
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created || steps.manual.outputs.created }}
      sha: ${{ steps.release.outputs.sha || steps.manual.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name || steps.manual.outputs.tag }}
    steps:
      - name: Create or update the release pull request
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve the release rebuild
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          release_ref="$RELEASE_REF"
          if [[ -z "$release_ref" ]]; then
            release_ref="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
          fi
          release_sha="$(gh api "repos/$GH_REPO/commits/$release_ref" --jq .sha)"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build ${{ matrix.name }} installer
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            script: package:mac
            artifact: release/*.dmg
            bundle: installer-macos
          - name: Windows x64
            runner: windows-latest
            script: package:windows
            artifact: release/*.exe
            bundle: installer-windows
          - name: Linux x64
            runner: ubuntu-latest
            script: package:linux
            artifact: release/*.AppImage
            bundle: installer-linux
    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer
        run: npm run ${{ matrix.script }}
      - name: Stage installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish-release:
    name: Attach installers and publish release
    needs:
      - release-please
      - build-installers
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Attach installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
