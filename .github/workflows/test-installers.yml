name: Test installers
run-name: Test installers from ${{ github.ref_name }} (${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installers:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            script: package:mac
            artifact: release/*.dmg
            bundle: test-installer-macos
          - name: Windows x64
            runner: windows-latest
            script: package:windows
            artifact: release/*.exe
            bundle: test-installer-windows
          - name: Linux x64
            runner: ubuntu-latest
            script: package:linux
            artifact: release/*.AppImage
            bundle: test-installer-linux
    steps:
      - name: Check out the selected branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer
        run: npm run ${{ matrix.script }}
      - name: Upload test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
